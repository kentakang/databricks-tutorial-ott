bundle:
  name: media-ott-recommendations
  engine: direct

variables:
  sql_warehouse_id:
    description: Existing SQL Warehouse ID used by the development demo
  catalog_name:
    description: Unity Catalog catalog containing the governed OTT data
    default: media_dev
  schema_name:
    description: Unity Catalog schema containing the governed OTT data
    default: ott_recommendations
  serving_endpoint_name:
    description: Existing Databricks Foundation Model endpoint used for AI curation
    default: databricks-qwen3-next-80b-a3b-instruct
  ai_search_endpoint_name:
    description: AI Search endpoint used for semantic recommendation retrieval
    default: media-ott-recommendations-search
  embedding_model_endpoint_name:
    description: Databricks embedding model used by the Delta Sync AI Search index
    default: databricks-qwen3-embedding-0-6b
  mlflow_experiment_name:
    description: Workspace path for SceneFlow recommendation and AI curation monitoring
    default: /Shared/media-ott-recommendations-monitoring

resources:
  vector_search_endpoints:
    recommendation_search:
      name: ${var.ai_search_endpoint_name}
      endpoint_type: STANDARD
  vector_search_indexes:
    movie_recommendations:
      name: ${var.catalog_name}.${var.schema_name}.movie_recommendations_search
      endpoint_name: ${resources.vector_search_endpoints.recommendation_search.name}
      primary_key: movie_id
      index_type: DELTA_SYNC
      index_subtype: HYBRID
      delta_sync_index_spec:
        source_table: ${var.catalog_name}.${var.schema_name}.movie_search_documents
        pipeline_type: TRIGGERED
        columns_to_sync:
          - movie_id
        embedding_source_columns:
          - name: retrieval_text
            embedding_model_endpoint_name: ${var.embedding_model_endpoint_name}
  experiments:
    recommendation_monitoring:
      name: ${var.mlflow_experiment_name}
  apps:
    app:
      name: 'media-ott-consumer-app'
      description: 'SceneFlow consumer OTT recommendation sales demo'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: ai-curation-model
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: vector-search-index
          uc_securable:
            securable_full_name: ${resources.vector_search_indexes.movie_recommendations.name}
            securable_type: TABLE
            permission: SELECT
        - name: mlflow-experiment
          experiment:
            experiment_id: ${resources.experiments.recommendation_monitoring.id}
            permission: CAN_EDIT
        - name: consumer-profiles
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.schema_name}.consumer_profiles
            securable_type: TABLE
            permission: SELECT
        - name: movies
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.schema_name}.movies
            securable_type: TABLE
            permission: SELECT
        - name: viewer-interactions
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.schema_name}.viewer_interactions
            securable_type: TABLE
            permission: SELECT
        - name: movie-quality-signals
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.schema_name}.movie_quality_signals
            securable_type: TABLE
            permission: SELECT
        - name: critic-commentary
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.schema_name}.critic_commentary
            securable_type: TABLE
            permission: SELECT

targets:
  dev:
    default: true
    mode: development
